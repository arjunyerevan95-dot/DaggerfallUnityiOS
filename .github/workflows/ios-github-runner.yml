name: iOS GitHub runner bootstrap

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios-build:
    name: Unity export and unsigned Xcode compile
    runs-on: macos-14
    timeout-minutes: 120

    env:
      IOS_EXPORT_PATH: ${{ github.workspace }}/Build/iOS
      IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/Build/DerivedData-iOS
      IOS_XCODE_LOG: ${{ github.workspace }}/Build/logs/ios-xcodebuild.log
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_VERSION: 2022.3.62f3
      UNITY_BIN: /Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify pinned baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          pinned='0fa65294523a132a0e5389d125f58d6566a1e815'
          git merge-base --is-ancestor "$pinned" HEAD
          grep -F 'm_EditorVersion: 2022.3.62f3' ProjectSettings/ProjectVersion.txt

      - name: Validate Unity named-user credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_USERNAME:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo 'Unity Personal CI activation requires repository Actions secrets UNITY_USERNAME and UNITY_PASSWORD.' >&2
            exit 2
          fi
          echo 'Unity named-user credentials are configured.'

      - name: Cache Unity project Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-macos-ios-2022.3.62f3-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-macos-ios-2022.3.62f3-

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/logs
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash 2>&1 \
            | tee Build/logs/unity-cli-install.log

          unity_cli_bin="$(find "$HOME" -type f -name unity -perm -111 2>/dev/null | head -n 1)"
          if [[ -z "$unity_cli_bin" ]]; then
            echo 'Unity CLI installer completed but no executable named unity was found under HOME.' >&2
            exit 3
          fi

          echo "UNITY_CLI_BIN=$unity_cli_bin" >> "$GITHUB_ENV"
          echo "$(dirname "$unity_cli_bin")" >> "$GITHUB_PATH"
          "$unity_cli_bin" --version 2>&1 | tee -a Build/logs/unity-cli-install.log

      - name: Install Unity editor and iOS Build Support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/logs
          if [[ ! -x "$UNITY_BIN" ]]; then
            "$UNITY_CLI_BIN" install "$UNITY_VERSION" \
              -m ios \
              --accept-eula \
              --non-interactive \
              --yes 2>&1 | tee Build/logs/unity-editor-install.log
          fi
          test -x "$UNITY_BIN"
          "$UNITY_BIN" -version 2>&1 | tee -a Build/logs/unity-editor-install.log

      - name: Install pinned Unity licensing CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @rage-against-the-pixel/unity-cli@2.0.0 \
            2>&1 | tee Build/logs/unity-licensing-cli-install.log
          unity-cli --version 2>&1 | tee -a Build/logs/unity-licensing-cli-install.log

      - name: Activate Unity Personal license
        shell: bash
        run: |
          set -euo pipefail
          unity-cli activate-license \
            --license personal \
            --email "$UNITY_USERNAME" \
            --password "$UNITY_PASSWORD" \
            --verbose 2>&1 | tee Build/logs/unity-license-activation.log
          unity-cli license-context 2>&1 | tee -a Build/logs/unity-license-activation.log

      - name: Export unsigned iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/logs
          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod DaggerfallUnityIOS.Editor.IOSBuild.BuildFromCommandLine \
            -logFile "$GITHUB_WORKSPACE/Build/logs/unity-ios-export.log"

      - name: Validate Unity export
        shell: bash
        run: |
          set -euo pipefail
          test -d Build/iOS/Unity-iPhone.xcodeproj
          test -f Build/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          xcodebuild -version

      - name: Compile unsigned iphoneos target
        shell: bash
        run: bash scripts/build-ios-xcode.sh

      - name: Return Unity Personal license
        if: always()
        shell: bash
        run: |
          if command -v unity-cli >/dev/null 2>&1; then
            unity-cli return-license --license personal --verbose \
              2>&1 | tee -a Build/logs/unity-license-activation.log || true
          fi

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-unity-ios-bootstrap-${{ github.run_number }}
          path: |
            Build/iOS
            Build/logs
          if-no-files-found: warn
          retention-days: 7
