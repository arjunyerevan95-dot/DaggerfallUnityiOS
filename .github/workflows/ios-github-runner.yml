name: iOS GitHub runner bootstrap

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  personal-license-probe:
    name: Probe official Unity Personal activation
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          pinned='0fa65294523a132a0e5389d125f58d6566a1e815'
          git merge-base --is-ancestor "$pinned" HEAD
          grep -F 'm_EditorVersion: 2022.3.62f3' ProjectSettings/ProjectVersion.txt

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/logs
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash 2>&1 \
            | tee Build/logs/unity-cli-install.log

          unity_cli_bin="$(find "$HOME" -type f -name unity -perm -111 2>/dev/null | head -n 1)"
          if [[ -z "$unity_cli_bin" ]]; then
            echo 'Unity CLI installer completed but no executable named unity was found under HOME.' >&2
            exit 3
          fi

          echo "UNITY_CLI_BIN=$unity_cli_bin" >> "$GITHUB_ENV"
          "$unity_cli_bin" --version 2>&1 | tee -a Build/logs/unity-cli-install.log

      - name: Install Unity Hub licensing client
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask unity-hub 2>&1 | tee Build/logs/unity-hub-install.log
          test -x "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"

      - name: Probe official Personal activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          command = [
              os.environ['UNITY_CLI_BIN'],
              '--non-interactive',
              '--format',
              'json',
              'license',
              'activate',
              '--personal',
              '--accept-eula',
          ]

          try:
              completed = subprocess.run(
                  command,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=120,
                  check=False,
              )
              output = completed.stdout or ''
              exit_code = completed.returncode
          except subprocess.TimeoutExpired as exc:
              output = (exc.stdout or '')
              if isinstance(output, bytes):
                  output = output.decode('utf-8', errors='replace')
              output += '\nActivation timed out after 120 seconds.\n'
              exit_code = 124

          os.makedirs('Build/logs', exist_ok=True)
          with open('Build/logs/unity-personal-activation-probe.log', 'w', encoding='utf-8') as handle:
              handle.write(output)
              handle.write(f'\nEXIT_CODE={exit_code}\n')

          print(output)
          print(f'EXIT_CODE={exit_code}')
          sys.exit(0 if exit_code == 0 else 42)
          PY

      - name: Capture license status
        if: always()
        shell: bash
        run: |
          "$UNITY_CLI_BIN" --non-interactive --format json license status \
            2>&1 | tee Build/logs/unity-license-status.log || true

      - name: Upload Personal activation probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-unity-personal-activation-probe-${{ github.run_number }}
          path: Build/logs
          if-no-files-found: error
          retention-days: 7
