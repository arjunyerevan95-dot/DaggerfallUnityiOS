name: iOS GitHub runner bootstrap

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  licensing-diagnostic:
    name: Inspect Unity CLI licensing commands
    runs-on: macos-14
    timeout-minutes: 20

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          pinned='0fa65294523a132a0e5389d125f58d6566a1e815'
          git merge-base --is-ancestor "$pinned" HEAD
          grep -F 'm_EditorVersion: 2022.3.62f3' ProjectSettings/ProjectVersion.txt

      - name: Validate Unity named-user credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_USERNAME:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo 'Unity Personal CI activation requires repository Actions secrets UNITY_USERNAME and UNITY_PASSWORD.' >&2
            exit 2
          fi
          echo 'Unity named-user credentials are configured.'

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/logs
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash 2>&1 \
            | tee Build/logs/unity-cli-install.log

          unity_cli_bin="$(find "$HOME" -type f -name unity -perm -111 2>/dev/null | head -n 1)"
          if [[ -z "$unity_cli_bin" ]]; then
            echo 'Unity CLI installer completed but no executable named unity was found under HOME.' >&2
            exit 3
          fi

          echo "UNITY_CLI_BIN=$unity_cli_bin" >> "$GITHUB_ENV"
          "$unity_cli_bin" --version 2>&1 | tee -a Build/logs/unity-cli-install.log

      - name: Capture authoritative licensing help
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== unity --help ==='
            "$UNITY_CLI_BIN" --help
            echo
            echo '=== unity auth login --help ==='
            "$UNITY_CLI_BIN" auth login --help
            echo
            echo '=== unity license --help ==='
            "$UNITY_CLI_BIN" license --help
            echo
            echo '=== unity license activate --help ==='
            "$UNITY_CLI_BIN" license activate --help
            echo
            echo '=== unity license status --help ==='
            "$UNITY_CLI_BIN" license status --help
            echo
            echo '=== unity license return --help ==='
            "$UNITY_CLI_BIN" license return --help
          } 2>&1 | tee Build/logs/unity-cli-licensing-help.log

          echo 'Licensing syntax captured. This diagnostic run intentionally stops before activation.' >&2
          exit 42

      - name: Upload licensing diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-unity-licensing-diagnostic-${{ github.run_number }}
          path: Build/logs
          if-no-files-found: error
          retention-days: 7
